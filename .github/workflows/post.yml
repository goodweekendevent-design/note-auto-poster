name: Auto post to note

on:
  schedule:
    # 毎日 朝9時(JST) = 0:00 UTC に実行
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      publish:
        description: "trueで公開 / falseで下書き"
        default: "true"

permissions:
     contents: write
     issues: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: |
          npm install
          npx playwright install --with-deps chromium

      # 前回保存したnoteのログインセッションを復元
      - name: Restore session
        uses: actions/cache@v4
        with:
          path: state.json
          key: note-session-${{ github.run_id }}
          restore-keys: note-session-

      - name: Generate article with Claude
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node src/generate.js

      - name: Install Japanese fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Generate thumbnail
        run: node src/thumbnail.js

      - name: Post to note
        env:
          NOTE_SESSION: ${{ secrets.NOTE_SESSION }}
          PUBLISH: ${{ github.event.inputs.publish || 'false' }}
          DEBUG: "true"
        run: node src/post.js

      # 消費したtopics.txtをコミットして戻す
      - name: Commit topic consumption
        run: |
          git config user.name "note-bot"
          git config user.email "bot@example.com"
          git add topics.txt || true
          git diff --cached --quiet || git commit -m "consume topic [skip ci]"
          git push || true

      - name: Notify success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE=$(grep '^title=' result.txt | cut -d= -f2-)
          URL=$(grep '^url=' result.txt | cut -d= -f2-)
          MODE=$(grep '^mode=' result.txt | cut -d= -f2-)
          gh issue create \
            --title "✅ note投稿成功(${MODE}): ${TITLE}" \
            --body "記事「${TITLE}」を${MODE}として保存しました。

          編集画面: ${URL}
          下書き一覧: https://note.com/sitesettings/text

          実行ログ: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Notify failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "❌ note自動投稿が失敗しました" \
            --body "実行ログとスクショを確認してください。

          実行ログ: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          よくある原因: NOTE_SESSIONの期限切れ、noteのUI変更。"

      # 失敗時のデバッグ用スクショを保存
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: debug-*.png
          if-no-files-found: ignore
